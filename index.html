    <style>
        /* Tokens and the shared components (.ws shell, short hero, privacy
           line, .cs-btn, .field, .dropzone) come from carino-ui.css. */
        :root {
            --tp-bracket: #ef4444;   /* [bracketed] cues in the script */
            --tp-size: 120px;        /* script size; set from the rail */
        }
        html, body { height: 100%; }
        body { display: flex; flex-direction: column; overflow: hidden; }
        .ws { flex: 1; min-height: 0; }
        .ws-rail .field { min-width: 0; }
        .ws-rail .field label { display: flex; justify-content: space-between; }
        .ws-rail .field output { font-family: var(--mono); color: var(--text-sec); }
        .ws-rail input[type="range"] { width: 100%; accent-color: var(--accent); }
        .tp-input { padding: 14px; font-size: var(--fs-sm); }
        .tp-input .dz-hint { margin-top: 4px; }
        .tp-row { display: flex; gap: 8px; flex-wrap: wrap; }
        input[type="file"] { display: none; }
        /* Phones: the ☰ alone, so the brand keeps its room. */
        @media (max-width: 640px) { .ws-toggle-lbl { display: none; } }

        /* ---- the prompter: the pane is the stage ---- */
        .tp-pane { position: relative; padding: 0; overflow: hidden; display: flex; }
        #teleprompter {
            flex: 1; min-width: 0;
            font-family: var(--display);
            font-size: var(--tp-size);
            line-height: 1.2;
            text-align: center;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
            padding: 40vh 8% 60vh;
            outline: none;
            transition: transform 0.3s;
        }
        #teleprompter.mirrored { transform: scaleX(-1); }
        .bracket-text { color: var(--tp-bracket); }
        .marker {
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
            pointer-events: none;
        }
        .marker[hidden] { display: none; }
        @media (max-width: 640px) {
            #teleprompter { padding: 30vh 5% 60vh; }
        }
        @media (prefers-reduced-motion: reduce) {
            #teleprompter { transition: none; }
        }
    </style>
</head>
<body>
    <div class="tp-actions" data-carino-actions>
        <button type="button" class="cs-btn ws-toggle" data-ws-toggle data-priority="1" aria-label="Settings">☰ <span class="ws-toggle-lbl" data-i18n>Settings</span></button>
        <button type="button" class="cs-btn" id="resetBtn" onclick="resetTeleprompter()" data-i18n>Back to top</button>
        <button type="button" class="cs-btn" id="playBtn" data-priority="1" aria-pressed="false" onclick="toggleScroll()" data-i18n>Play</button>
    </div>

    <div class="ws" role="main">
        <aside class="ws-rail" aria-label="Settings">
            <div class="short-hero rail-head">
                <img class="mark" src="logo.svg" alt="" width="32" height="32">
                <div><h1>Teleprompter</h1><p class="sh-lede" data-i18n>Paste your script or open a file, then press Play and read.</p></div>
            </div>

            <div class="t-label" data-i18n>Script</div>
            <div class="dropzone tp-input" id="dropZone" role="button" tabindex="0">
                <div><span data-i18n>Drop a text file here or</span> <strong data-i18n>browse</strong></div>
                <div class="dz-hint" data-i18n>Or paste into the prompter</div>
            </div>
            <input type="file" id="fileInput" accept=".txt,.md,text/plain">

            <div class="t-label" data-i18n>Reading</div>
            <div class="field">
                <label for="speed"><span data-i18n>Speed</span> <output id="speedVal"></output></label>
                <input type="range" id="speed" min="1" max="12" step="1">
            </div>
            <div class="field">
                <label for="size"><span data-i18n>Text size</span> <output id="sizeVal"></output></label>
                <input type="range" id="size" min="24" max="300" step="2">
            </div>
            <div class="field">
                <label for="fontSel" data-i18n>Font</label>
                <select class="select" id="fontSel">
                    <option value="display">Red Hat Display</option>
                    <option value="sans">IBM Plex Sans</option>
                    <option value="mono">IBM Plex Mono</option>
                </select>
            </div>
            <div class="field">
                <label for="markerSel" data-i18n>Reading marker</label>
                <select class="select" id="markerSel">
                    <option value="0" data-i18n>Off</option>
                    <option value="1" data-i18n>Top left</option>
                    <option value="2" data-i18n>Top right</option>
                    <option value="3" data-i18n>Middle left</option>
                    <option value="4" data-i18n>Middle right</option>
                </select>
            </div>
            <label class="check"><input type="checkbox" id="mirror"> <span data-i18n>Mirror, for teleprompter glass</span></label>

            <div class="ws-rail-foot">
                <p class="privacy-line" data-i18n>Runs in your browser. Nothing you add here is uploaded.</p>
            </div>
        </aside>

        <div class="ws-pane tp-pane">
            <div id="teleprompter" contenteditable="true" spellcheck="false" aria-label="Script"></div>
            <div id="marker" class="marker" hidden></div>
        </div>
    </div>

    <script>
        // Nothing moves until Play is pressed: no auto-scroll on load.
        const tp = document.getElementById('teleprompter');
        const tt = k => (typeof t === 'function' ? t(k) : k);
        let scrolling = false;
        let speed = 3;
        let carry = 0;   // sub-pixel scroll left over between frames

        // The sample, as a script: [bracketed] words are cues and show in red.
        const SAMPLE = 'Sample script.\n\nPaste your own text here, or open a text file from the settings. ' +
            'Words in [brackets] are cues for you, shown in red. Press [Play] to start scrolling ' +
            'and again to pause. This tool is [free] and [open source].';

        // Text in, as text nodes: [bracketed] runs become red spans, built with
        // the DOM rather than innerHTML, so a pasted script can never be markup.
        let isSample = false;   // still showing the sample: re-translate it on a language change
        function setScript(text, sample) {
            isSample = !!sample;
            tp.textContent = '';
            const re = /\[(.*?)\]/g;
            let last = 0, m;
            while ((m = re.exec(text))) {
                if (m.index > last) tp.appendChild(document.createTextNode(text.slice(last, m.index)));
                const span = document.createElement('span');
                span.className = 'bracket-text';
                span.textContent = m[0];
                tp.appendChild(span);
                last = re.lastIndex;
            }
            if (last < text.length) tp.appendChild(document.createTextNode(text.slice(last)));
            tp.scrollTop = 0;
        }

        function scrollStep() {
            if (!scrolling) return;
            carry += speed * 0.5;
            const px = Math.floor(carry);
            carry -= px;
            tp.scrollTop += px;
            if (tp.scrollTop + tp.clientHeight >= tp.scrollHeight - 1) { setPlaying(false); return; }
            requestAnimationFrame(scrollStep);
        }
        function setPlaying(on) {
            scrolling = on;
            const b = document.getElementById('playBtn');
            b.setAttribute('aria-pressed', on ? 'true' : 'false');
            b.dataset.i18nKey = on ? 'Pause' : 'Play';
            b.textContent = tt(b.dataset.i18nKey);
            if (on) requestAnimationFrame(scrollStep);
        }
        function toggleScroll() { setPlaying(!scrolling); }
        function resetTeleprompter() { tp.scrollTop = 0; }

        // ---- settings ----
        const FONTS = { display: 'var(--display)', sans: 'var(--sans)', mono: 'var(--mono)' };
        const speedIn = document.getElementById('speed');
        const sizeIn = document.getElementById('size');
        function applySpeed() { speed = +speedIn.value; document.getElementById('speedVal').textContent = speed; }
        function applySize() {
            document.documentElement.style.setProperty('--tp-size', sizeIn.value + 'px');
            document.getElementById('sizeVal').textContent = sizeIn.value + ' px';
        }
        speedIn.addEventListener('input', applySpeed);
        sizeIn.addEventListener('input', applySize);
        document.getElementById('fontSel').addEventListener('change', e => { tp.style.fontFamily = FONTS[e.target.value]; });
        document.getElementById('mirror').addEventListener('change', e => { tp.classList.toggle('mirrored', e.target.checked); });

        // The marker: a white arrow at the reading line, pointing at the text.
        const MARKERS = [null,
            { top: '5%', side: 'left' }, { top: '5%', side: 'right' },
            { top: '40%', side: 'left' }, { top: '40%', side: 'right' }];
        document.getElementById('markerSel').addEventListener('change', e => {
            const m = document.getElementById('marker');
            const pos = MARKERS[+e.target.value];
            m.hidden = !pos;
            if (!pos) return;
            const left = pos.side === 'left';
            Object.assign(m.style, {
                top: pos.top, left: left ? '10px' : 'auto', right: left ? 'auto' : '10px',
                borderWidth: left ? '40px 0 40px 80px' : '40px 80px 40px 0',
                borderColor: left ? 'transparent transparent transparent #fff' : 'transparent #fff transparent transparent',
            });
        });

        // ---- script in: file, drop or paste ----
        function readFile(file) {
            if (!file) return;
            file.text().then(setScript);
        }
        const zone = document.getElementById('dropZone');
        const fileIn = document.getElementById('fileInput');
        zone.addEventListener('click', () => fileIn.click());
        zone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileIn.click(); } });
        fileIn.addEventListener('change', () => { readFile(fileIn.files[0]); fileIn.value = ''; });
        ['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => { e.preventDefault(); zone.classList.add('dragover'); }));
        ['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, () => zone.classList.remove('dragover')));
        document.addEventListener('drop', e => {
            e.preventDefault();
            if (e.dataTransfer && e.dataTransfer.files.length) readFile(e.dataTransfer.files[0]);
        });
        // A paste into the prompter replaces the script (as plain text); pastes
        // into the settings fields stay ordinary pastes.
        tp.addEventListener('paste', e => {
            e.preventDefault();
            setScript(e.clipboardData.getData('text'));
        });

        // Space plays and pauses, unless you are typing in the script or a field.
        document.addEventListener('keydown', e => {
            if (e.key !== ' ' || e.target === tp || e.target.closest('input, select, textarea, button')) return;
            e.preventDefault();
            toggleScroll();
        });

        // Start: a size that fits the screen, the sample script, everything still.
        sizeIn.value = Math.round(Math.max(40, Math.min(200, tp.clientWidth / 8)) / 2) * 2;
        speedIn.value = speed;
        applySpeed(); applySize();
        setScript(tt(SAMPLE), true);
        tp.addEventListener('input', () => { isSample = false; });
        // i18n.js calls this after each language pass.
        function repaintTp() { if (isSample) setScript(tt(SAMPLE), true); }
    </script>
    <script src="carino-navbar.js" data-app="Teleprompter" data-repo="Teleprompter" defer></script>
    <script src="carino-ui.js" defer></script>
    <script src="carino-lang.js" defer></script>
    <script src="i18n.js" defer></script>
</body>
</html>
